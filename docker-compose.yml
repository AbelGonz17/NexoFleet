name: nexofleet

services:
  postgres:
    image: postgres:17-alpine
    container_name: nexofleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexofleet}
      POSTGRES_USER: ${POSTGRES_USER:-nexofleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexofleet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexofleet} -d ${POSTGRES_DB:-nexofleet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexofleet-network

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: nexofleet-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-admin}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - nexofleet-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexofleet-network

volumes:
  nexofleet-postgres-data:
  nexofleet-pgadmin-data:

networks:
  nexofleet-network:
    driver: bridge
