name: nexofleet

services:
  postgres:
    image: postgres:17-alpine
    container_name: nexofleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexofleet}
      POSTGRES_USER: ${POSTGRES_USER:-nexofleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexofleet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexofleet} -d ${POSTGRES_DB:-nexofleet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexofleet-network

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: nexofleet-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-admin}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - nexofleet-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexofleet-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexofleet-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-nexofleet};Username=${POSTGRES_USER:-nexofleet};Password=${POSTGRES_PASSWORD:-change-me}"
      Frontend__Origin: ${FRONTEND_ORIGIN:-http://localhost:3000}
      Storage__LocalPath: /app/uploads
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    volumes:
      - nexofleet-backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexofleet-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexofleet-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - nexofleet-network

volumes:
  nexofleet-postgres-data:
  nexofleet-pgadmin-data:
  nexofleet-backend-uploads:

networks:
  nexofleet-network:
    driver: bridge
